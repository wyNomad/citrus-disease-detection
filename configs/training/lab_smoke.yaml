# 链路冒烟配置：只验证数据管线与训练/评估链路是否贯通，不用于精度评价。
# 使用时需用 --data 指向任意一组已构建数据集，并用 --epochs 覆盖轮次。
model: yolo11n.pt
name: lab_smoke
exist_ok: false
epochs: 2
patience: 20
pretrained: true
imgsz: 640
device: cpu
workers: 0
batch: 16
amp: false
seed: 42
plots: true
# 仅保留约 3% 的训练样本，让冒烟在单机 CPU 上几分钟内跑完
fraction: 0.03
