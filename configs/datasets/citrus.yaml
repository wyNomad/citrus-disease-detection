# 数据集路径相对本 YAML 文件；由 citrus-prepare-data 准备目录。
# 训练入口将其解析为绝对路径后保存到本次实验快照。
path: ../../data/citrus_mini
train: images/train
val: images/val

# 类别 ID 与标签、训练权重保持一致，不能按名称中的编号重排。
names:
  0: S0 others
  1: S1 Healthy fruit
  2: S2 Healthy leaf
  3: S3 Blotchy mottling
  4: S4 Red nose fruit
  5: S5 Zinc deficiency
  6: S6 Vein yellowing
  7: S7 Uniform yellowing
  8: S8 Magnesium deficiency
  9: S9 Boron deficiency
  10: S10 Anthracnose
  11: S11 Citrus greasy spot
  12: S14 Canker       # 标签 ID 12 对应 S14
  13: S13 Sooty mould  # 标签 ID 13 对应 S13
  14: S12 Algal spot   # 标签 ID 14 对应 S12
