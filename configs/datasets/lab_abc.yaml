# 实验数据集 · 健康(S1~S2) + 典型黄龙病(S3~S4) + 疑似黄龙病(S5~S7)，共 7 类
# 由 citrus-build-groups 生成，源数据见 docs/DATA_AND_MODELS.md。
# path 相对本文件，指向仓库内 data/ 下已构建的数据集（data/ 不提交 Git）。
path: ../../data/lab_abc
train: images/train
val: images/val

# 类别编号沿用源数据集 label_object.json 的原始 ID，不做重映射，
# 以便与数据集官方 YOLOv5l 权重保持同一标签空间、可直接横向对比。
# ID 0（S0 others）在全库中标注框数为 0，是源数据集预留的背景类。
names:
  0: S0 others
  1: S1 Healthy fruit
  2: S2 Healthy leaf
  3: S3 Blotchy mottling
  4: S4 Red nose fruit
  5: S5 Zinc deficiency
  6: S6 Vein yellowing
  7: S7 Uniform yellowing
  8: S8 Magnesium deficiency
  9: S9 Boron deficiency
  10: S10 Anthracnose
  11: S11 Citrus greasy spot
  12: S14 Canker
  13: S13 Sooty mould
  14: S12 Algal spot and moss
