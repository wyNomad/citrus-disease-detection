name: Repository checks
'on':
  push:
    branches: [master, integration/**]
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CITRUS_FAIL_ON_SKIP: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'
    - name: Install core, geometry and test dependencies
      run: python -m pip install -e . -r requirements/dev.txt 'opencv-python>=4.7,<4.12'
    - name: Check Python, XML, YAML and local documentation links
      run: python .github/scripts/check_repository.py
    - name: Run all core tests without skips
      run: python -m pytest -q --ignore=tests/ros
    - name: Build distributions
      run: python -m build
    - name: Validate wheel outside checkout in a clean venv
      run: python .github/scripts/check_wheel.py
  ros:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    env:
      CITRUS_FAIL_ON_SKIP: '1'
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '187'
      ROS_LOG_DIR: /tmp/citrus-ci-ros
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Install ROS and Python build dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y python3-pip python3-venv python3-colcon-common-extensions ros-humble-cv-bridge ros-humble-message-filters
        python3 -m venv --system-site-packages .venv
        .venv/bin/python -m pip install --upgrade 'pip<26' 'setuptools>=68,<80' wheel
        .venv/bin/python -m pip install -e . -r requirements/dev.txt 'opencv-python>=4.7,<4.12'
    - name: Build all project ROS packages from source
      shell: bash
      run: |
        source /opt/ros/humble/setup.bash
        .venv/bin/python scripts/build_ros.py --core-only
    - name: Test ROS transport, guards, failure exit and packaging without skips
      shell: bash
      run: |
        source /opt/ros/humble/setup.bash
        source ros2_ws/install/setup.bash
        .venv/bin/python -m pytest -q tests/ros tests/test_packaging.py
  training-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      YOLO_OFFLINE: 'true'
      YOLO_AUTOINSTALL: 'false'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'
    - name: Install matched CPU PyTorch and torchvision
      run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
    - name: Install training and export dependencies
      run: python -m pip install -e . -r requirements/export.txt ultralytics==8.4.140
    - name: Train synthetic YOLO11 for one epoch and reload exported ONNX
      run: python scripts/check_training_export.py --output /tmp/citrus-training-smoke
