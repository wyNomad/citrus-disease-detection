name: 运行问题
description: 报告数据处理、训练或检测入口的运行问题
title: "[Bug] "
labels: []
body:
  - type: dropdown
    id: entry
    attributes:
      label: 运行入口
      options:
        - split_data.py
        - scripts/train.py
        - scripts/detect.py
        - utils/arm_vision.py
        - main.py
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 系统、Python、Ultralytics、PyTorch、设备，以及代码版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与配置
      description: 运行命令、修改过的参数、数据目录结构和模型来源。
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 实际结果与错误日志
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
