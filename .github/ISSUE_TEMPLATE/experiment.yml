name: 实验与实机验证记录
description: 记录模型训练、识别效果、相机三维定位或 RK3588 部署结果
title: "[Experiment] "
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: 实验类型
      options:
        - 数据划分与模型训练
        - 离线识别效果与模型对比
        - 模型导出与后端数值一致性
        - 合成 ROS 通路
        - Gemini 305 真机取流与三维定位
        - RK3588 / NPU 部署与性能
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 实验目的与验收标准
      description: 说明本次要回答的问题，以及通过的判断条件。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 代码、配置与运行环境
      description: 记录提交 SHA、配置文件、系统/架构、依赖版本与设备。真机实验补充固件、驱动和 Runtime。
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 输入数据与模型
      description: 数据来源/版本、划分 seed、类别映射、样本数、模型架构及权重 SHA-256。明确合成数据、回放数据还是真实采集。
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: 方法与实际命令
      description: 训练超参数、推理后端和输入尺寸；定位实验补充深度对齐、单位、内参、同步窗口及测量方法。
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 结果与分析
      description: 分类/检测指标、坐标误差、数值对比或性能结果。速度注明分辨率、批量、预后处理范围、预热和测量次数。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 失败案例与尚未验证项
      description: 明确已验证范围、失败条件和后续工作；合成通路结果应与真机精度结果分别记录。
    validations:
      required: true
