<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Citrus Disease Detection — Capture, Detect, Localize</title>
  <desc id="desc">A citrus fruit and stereo camera illustrate the project's Gemini 305 detection and RGB-D localization pipeline, supported by upstream model training. Hardware validation and RK3588 adaptation remain future work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1a24"/><stop offset="1" stop-color="#153b32"/>
    </linearGradient>
    <radialGradient id="fruit" cx=".35" cy=".3" r=".8">
      <stop stop-color="#ffdc8b"/><stop offset="1" stop-color="#f39135"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#87d8bd" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="lens" x2="1" y2="1">
      <stop stop-color="#243e49"/><stop offset="1" stop-color="#4ea68c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#background)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1134" cy="112" r="190" fill="#5bddb0" opacity=".035"/>
  <path d="M50 56V264" stroke="#7be0b4" stroke-width="4" stroke-linecap="round"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="76" y="76" font-size="12" letter-spacing="3" fill="#87d9bb">AGRICULTURAL COMPUTER VISION</text>
    <text x="73" y="135" font-size="41" font-weight="700" fill="#f1faf5">Citrus Disease Detection</text>
    <text x="76" y="174" font-size="18" fill="#b9d0c7">Gemini 305 perception with RGB-D coordinates.</text>
    <g font-size="12" font-weight="600" fill="#e3f8ed">
      <rect x="76" y="207" width="108" height="30" rx="15" fill="#285247"/>
      <text x="90" y="227">GEMINI 305</text>
      <path d="M195 222H214M209 217l5 5-5 5" fill="none" stroke="#79bba0" stroke-width="1.5"/>
      <rect x="225" y="207" width="108" height="30" rx="15" fill="#285247"/>
      <text x="248" y="227">DETECTION</text>
      <path d="M344 222H363M358 217l5 5-5 5" fill="none" stroke="#79bba0" stroke-width="1.5"/>
      <rect x="374" y="207" width="128" height="30" rx="15" fill="#5c4830"/>
      <text x="394" y="227" fill="#ffe4bc">3D POSITION</text>
    </g>
    <text x="76" y="273" font-size="12" letter-spacing="1" fill="#87aaa0">PYTHON 3.10  /  ROS 2 HUMBLE  /  GEMINI 305</text>
  </g>
