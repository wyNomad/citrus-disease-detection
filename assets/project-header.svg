    <circle r="92" fill="none" stroke="#70b99e" stroke-opacity=".18"/>
    <path d="M-107-51v-30h30M77-81h30v30M107 51v30H77M-77 81h-30V51" fill="none" stroke="#8be4b6" stroke-width="2"/>
    <circle cy="5" r="49" fill="url(#fruit)"/>
