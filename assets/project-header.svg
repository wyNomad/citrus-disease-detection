    <path d="M-21-17q-15 18-9 36" fill="none" stroke="#fff0bf" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    <path d="M-9 5H9M0-4V14" stroke="#6a4b2f" stroke-width="1.5"/>
