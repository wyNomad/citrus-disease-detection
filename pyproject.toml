[build-system]
requires = ["setuptools>=68,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus-vision-core"
version = "0.1.0"
description = "Citrus detection and RGB-D localization shared core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
inference = ["ultralytics>=8.3.65,<9", "opencv-python>=4.7,<4.12"]
train = ["ultralytics>=8.3.65,<9", "opencv-python>=4.7,<4.12"]
dev = ["pytest>=7,<9", "build>=1,<2"]
export = ["ultralytics>=8.3.65,<9", "opencv-python>=4.7,<4.12", "onnx>=1.16,<1.19", "onnxruntime>=1.18,<2"]

[project.scripts]
citrus-detect = "citrus_vision.cli:detect_main"
citrus-train = "citrus_vision.cli:train_main"
citrus-val = "citrus_vision.cli:val_main"
citrus-prepare-data = "citrus_vision.dataset:main"
citrus-export = "citrus_vision.cli:export_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
